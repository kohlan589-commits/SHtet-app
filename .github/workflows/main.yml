// 2. AI HUB SCREEN (Gemini AI Chat)
class AIHubScreen extends StatefulWidget {
  const AIHubScreen({super.key});

  @override
  State<AIHubScreen> createState() => _AIHubScreenState();
}

class _AIHubScreenState extends State<AIHubScreen> {
  static const String _apiKey = 'YOUR_GEMINI_API_KEY_HERE';
  
  final TextEditingController _controller = TextEditingController();
  final List<Map<String, String>> _messages = [];
  bool _isLoading = false;

  Future<void> _callGeminiAI(String prompt) async {
    if (prompt.isEmpty) return;

    setState(() {
      _messages.add({'sender': 'user', 'text': prompt});
      _isLoading = true;
    });
    _controller.clear();

    try {
      final model = GenerativeModel(model: 'gemini-1.5-flash', apiKey: _apiKey);
      final response = await model.generateContent([Content.text(prompt)]);
      
      setState(() {
        _messages.add({'sender': 'ai', 'text': response.text ?? 'အဖြေမရှိပါ။'});
      });
    } catch (e) {
      setState(() {
        _messages.add({'sender': 'ai', 'text': 'Error: API Key ထည့်သွင်းမှုကို စစ်ဆေးပါ။'});
      });
    } finally {
      setState(() {
        _isLoading = false;
      });
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Row(
          children: [
            Icon(Icons.auto_awesome, color: Color(0xFF00E5FF)),
            SizedBox(width: 8),
            Text('SHtet AI Hub'),
          ],
        ),
        backgroundColor: const Color(0xFF1E1E1E),
      ),
      body: Column(
        children: [
          Expanded(
            child: ListView.builder(
              padding: const EdgeInsets.all(16),
              itemCount: _messages.length,
              itemBuilder: (context, index) {
                final msg = _messages[index];
                final isUser = msg['sender'] == 'user';
                return Align(
                  alignment: isUser ? Alignment.centerRight : Alignment.centerLeft,
                  child: Container(
                    margin: const EdgeInsets.symmetric(vertical: 6),
                    padding: const EdgeInsets.all(12),
                    decoration: BoxDecoration(
                      color: isUser ? const Color(0xFF7C4DFF) : const Color(0xFF1E1E1E),
                      borderRadius: BorderRadius.circular(12),
                    ),
                    child: Text(msg['text'] ?? '', style: const TextStyle(color: Colors.white)),
                  ),
                );
              },
            ),
          ),
          if (_isLoading)
            const Padding(
              padding: EdgeInsets.all(8.0),
              child: CircularProgressIndicator(color: Color(0xFF00E5FF)),
            ),
          Container(
            padding: const EdgeInsets.all(8.0),
            color: const Color(0xFF1E1E1E),
            child: Row(
              children: [
                Expanded(
                  child: TextField(
                    controller: _controller,
                    style: const TextStyle(color: Colors.white),
                    decoration: const InputDecoration(
                      hintText: 'AI ကို Script သို့မဟုတ် အိုင်ဒီယာ မေးပါ...',
                      hintStyle: TextStyle(color: Colors.grey),
                      border: InputBorder.none,
                    ),
                  ),
                ),
                IconButton(
                  icon: const Icon(Icons.send, color: Color(0xFF00E5FF)),
                  onPressed: () => _callGeminiAI(_controller.text),
                ),
              ],
            ),
          ),
        ],
      ),
    );
  }
}

// 3. CREATOR DRIVE SCREEN (Cloud Storage)
class CreatorDriveScreen extends StatefulWidget {
  const CreatorDriveScreen({super.key});

  @override
  State<CreatorDriveScreen> createState() => _CreatorDriveScreenState();
}

class _CreatorDriveScreenState extends State<CreatorDriveScreen> {
  String _selectedFileName = 'ဖိုင် ရွေးချယ်ထားခြင်း မရှိသေးပါ';

  Future<void> _pickFile() async {
    FilePickerResult? result = await FilePicker.platform.pickFiles();
    if (result != null) {
      setState(() {
        _selectedFileName = result.files.single.name;
      });
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('SHtet Creator Drive'),
        backgroundColor: const Color(0xFF1E1E1E),
      ),
      body: Padding(
        padding: const EdgeInsets.all(24.0),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          crossAxisAlignment: CrossAxisAlignment.stretch,
          children: [
            const Icon(Icons.cloud_upload_outlined, size: 80, color: Color(0xFF7C4DFF)),
            const SizedBox(height: 20),
            const Text(
              'Creators များအတွက် Cloud Storage',
              textAlign: TextAlign.center,
              style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold),
            ),
            const SizedBox(height: 10),
            Text(
              _selectedFileName,
              textAlign: TextAlign.center,
              style: const TextStyle(color: Color(0xFF00E5FF)),
            ),
            const SizedBox(height: 30),
            ElevatedButton.icon(
              onPressed: _pickFile,
              icon: const Icon(Icons.folder_open),
              label: const Text('ဖိုင်ရွေးမည် (Pick File)'),
              style: ElevatedButton.styleFrom(
                backgroundColor: const Color(0xFF7C4DFF),
                foregroundColor: Colors.white,
                padding: const EdgeInsets.symmetric(vertical: 14),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
              ),
            ),
          ],
        ),
      ),
    );
  }
}
